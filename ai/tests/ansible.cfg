[defaults]
# No `inventory =` here: a comma list in ansible.cfg is read as paths, and the
# empty entry becomes this directory, making Ansible execute every script in
# it as a dynamic inventory (including run-contract-tests.sh, recursively).
# The runner passes `-i localhost,` instead.
# Stubs first, so they shadow the real backend and qdrant roles.
roles_path = stub_roles:../roles
stdout_callback = default
result_format = yaml
