---
# qdrant — Qdrant vector DB in Podman (see roles/podman_service for how it runs).

- name: Require an API key when Qdrant is reachable from other machines
  ansible.builtin.assert:
    that: qdrant_bind_address in ['127.0.0.1', '::1', 'localhost'] or qdrant_api_key | length > 0
    fail_msg: >-
      qdrant_bind_address is {{ qdrant_bind_address }}, which exposes Qdrant to the
      network. Set qdrant_api_key (from ansible-vault) or bind to 127.0.0.1.
    quiet: true

- name: Set Qdrant addresses
  ansible.builtin.set_fact:
    qdrant_client_address: >-
      {{ '127.0.0.1' if qdrant_bind_address in ['0.0.0.0', '::', ''] else qdrant_bind_address }}
    qdrant_unit_template: "{{ role_path }}/templates/qdrant.container.j2"

- name: Run Qdrant
  ansible.builtin.include_role:
    name: podman_service
  vars:
    podman_service_name: qdrant
    podman_service_template: "{{ qdrant_unit_template }}"
    podman_service_health_url: "http://{{ qdrant_client_address }}:{{ qdrant_http_port }}/readyz"
    podman_service_ready_retries: "{{ qdrant_ready_retries }}"

- name: Publish Qdrant endpoints
  ansible.builtin.set_fact:
    qdrant_url: "http://{{ qdrant_client_address }}:{{ qdrant_http_port }}"
    qdrant_grpc: "{{ qdrant_client_address }}:{{ qdrant_grpc_port }}"
