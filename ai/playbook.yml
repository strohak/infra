---
# ai/playbook.yml — local AI stack: inference server + Qdrant, on any host type.
#
#   This machine:  ansible-playbook -i ai/inventory/hosts.yml ai/playbook.yml --limit localhost -K
#   A server:      ansible-playbook -i ai/inventory/hosts.yml ai/playbook.yml --limit gpu-box -K
#   As root:       drop -K
#
# Order matters: host_facts detects the host; inference picks models and runs
# the chosen backend; qdrant starts the vector DB; open_webui the chat UI;
# ai_endpoints writes /etc/ai-stack/endpoints.env; inference_verify checks the
# contract through that file only.

- name: Local AI stack
  hosts: all
  roles:
    - host_facts
    - inference
    - qdrant
    - role: open_webui
      when: open_webui_enabled | default(true) | bool
    - ai_endpoints
    - inference_verify

  post_tasks:
    - name: Print summary
      vars:
        model_summary: >-
          {{ inference_model_roles | map('extract', inference_aliases)
             | zip(inference_model_roles | map('extract', inference_models))
             | map('join', '=') | join('  ') }}
      ansible.builtin.debug:
        msg:
          - "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          - " AI stack ready on {{ inventory_hostname }}"
          - "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          - " Host:       {{ ai_platform }} / {{ ai_accelerator }} / {{ ai_vram_mb }} MiB VRAM → tier {{ inference_tier_name }}"
          - " Inference:  {{ inference_backend }} @ {{ inference_base_url }} (service: ai-inference)"
          - " Models:     {{ model_summary }}"
          - " Qdrant:     {{ qdrant_url }}/dashboard  (gRPC {{ qdrant_grpc }})"
          - " Open WebUI: {{ open_webui_url | default('disabled') }}  (first account you create is admin)"
          - " Endpoints:  {{ ai_endpoints_dir }}/endpoints.env"
          - "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
