---
# LAN server profile: other machines connect to these hosts.
#
# Ollama has no authentication. Only expose it on a trusted network, and
# restrict the port with a firewall (e.g. `ufw allow from 192.168.1.0/24 to any
# port 11434`) or put a reverse proxy with auth in front of it.
inference_bind_address: 0.0.0.0

# Qdrant refuses a non-loopback bind without an API key. Keep the key in an
# encrypted vars file next to this one (every file in this directory is loaded):
#   ansible-vault create ai/inventory/group_vars/ai_servers/vault.yml
#     vault_qdrant_api_key: "<long random string>"
# and run the playbook with --ask-vault-pass.
qdrant_bind_address: 0.0.0.0
qdrant_api_key: "{{ vault_qdrant_api_key | default('') }}"
