---
# Hosts the AI stack can be installed on. Each group is a host "type"; put
# type-wide settings in group_vars/<group>.yml and one-off settings in
# host_vars/<host>.yml.
#
#   ai_local    the machine you're on (bones, a desktop...): loopback only
#   ai_servers  boxes that serve other machines on the LAN

all:
  children:
    ai_local:
      hosts:
        localhost:
          ansible_connection: local
          ansible_python_interpreter: "{{ ansible_playbook_python }}"

    ai_servers:
      hosts:
        # Example — uncomment and adjust:
        # gpu-box:
        #   ansible_host: 192.168.1.50
        #   ansible_user: sean
      vars: {}
