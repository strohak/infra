# llm-stack/compose.yml
# Self-hosted Langfuse for local LLM tracing on this workstation.
#
# Derived from upstream langfuse/langfuse docker-compose.yml at commit
# 87f8e038952c (2026-11). Changes from upstream:
#   - Secrets come from .env (generated by playbook.yml) and are required —
#     compose refuses to start with `${VAR:?...}` errors instead of silently
#     falling back to upstream's well-known default passwords.
#   - Every port is bound to 127.0.0.1 (upstream exposes 3000 and 9090 on all
#     interfaces). This is a single-user workstation, not a server.
#   - Dropped the optional langfuse-ai-gateway service and env vars that
#     default to empty upstream (AI features, Azure/OCI storage, SMTP, …).
#     Add them back from upstream if you want those features.
#
# To compare with upstream later:
#   curl -fsSL https://raw.githubusercontent.com/langfuse/langfuse/main/docker-compose.yml | diff - compose.yml
#
# Ollama is NOT in this file — it runs natively on the host (see playbook.yml)
# so it can use the GPU without the NVIDIA container toolkit.

name: llm-stack

x-langfuse-depends-on: &langfuse-depends-on
  postgres:
    condition: service_healthy
  minio:
    condition: service_healthy
  redis:
    condition: service_healthy
  clickhouse:
    condition: service_healthy

x-langfuse-env: &langfuse-env
  NEXTAUTH_URL: http://localhost:3000
  DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:?set in .env}@postgres:5432/postgres
  SALT: ${SALT:?set in .env}
  ENCRYPTION_KEY: ${ENCRYPTION_KEY:?set in .env}
  TELEMETRY_ENABLED: ${TELEMETRY_ENABLED:-false}
  LANGFUSE_ENABLE_EXPERIMENTAL_FEATURES: "false"
  CLICKHOUSE_MIGRATION_URL: clickhouse://clickhouse:9000
  CLICKHOUSE_URL: http://clickhouse:8123
  CLICKHOUSE_USER: clickhouse
  CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?set in .env}
  CLICKHOUSE_CLUSTER_ENABLED: "false"
  # MinIO (S3-compatible) holds raw ingested events and media uploads.
  LANGFUSE_S3_EVENT_UPLOAD_BUCKET: langfuse
  LANGFUSE_S3_EVENT_UPLOAD_REGION: auto
  LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID: minio
  LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:?set in .env}
  LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT: http://minio:9000
  LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE: "true"
  LANGFUSE_S3_EVENT_UPLOAD_PREFIX: events/
  LANGFUSE_S3_MEDIA_UPLOAD_BUCKET: langfuse
  LANGFUSE_S3_MEDIA_UPLOAD_REGION: auto
  LANGFUSE_S3_MEDIA_UPLOAD_ACCESS_KEY_ID: minio
  LANGFUSE_S3_MEDIA_UPLOAD_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:?set in .env}
  LANGFUSE_S3_MEDIA_UPLOAD_ENDPOINT: http://minio:9000
  LANGFUSE_S3_MEDIA_UPLOAD_FORCE_PATH_STYLE: "true"
  LANGFUSE_S3_MEDIA_UPLOAD_PREFIX: media/
  LANGFUSE_S3_BATCH_EXPORT_ENABLED: "false"
  REDIS_HOST: redis
  REDIS_PORT: "6379"
  REDIS_AUTH: ${REDIS_AUTH:?set in .env}
  REDIS_TLS_ENABLED: "false"

services:
  # Background processing: pulls ingested events off Redis/MinIO and writes
  # them to ClickHouse. Traces show up in the UI a few seconds after ingest.
  langfuse-worker:
    image: docker.langfuse.com/langfuse/langfuse-worker:${LANGFUSE_IMAGE_TAG:-4}
    restart: unless-stopped
    depends_on: *langfuse-depends-on
    ports:
      - 127.0.0.1:3030:3030
    environment:
      <<: *langfuse-env

  # UI + public API (including the OTLP endpoint at /api/public/otel).
  langfuse-web:
    image: docker.langfuse.com/langfuse/langfuse:${LANGFUSE_IMAGE_TAG:-4}
    restart: unless-stopped
    depends_on: *langfuse-depends-on
    ports:
      - 127.0.0.1:3000:3000
    environment:
      <<: *langfuse-env
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:?set in .env}
      # Browser-facing media URL (host port), vs. the in-network one.
      LANGFUSE_S3_MEDIA_UPLOAD_ENDPOINT: http://localhost:9090
      LANGFUSE_S3_MEDIA_UPLOAD_INTERNAL_ENDPOINT: http://minio:9000
      # Headless init: on first start, create an org, project, API key pair,
      # and admin user so nothing has to be clicked through in the UI.
      LANGFUSE_INIT_ORG_ID: ${LANGFUSE_INIT_ORG_ID:-}
      LANGFUSE_INIT_ORG_NAME: ${LANGFUSE_INIT_ORG_NAME:-}
      LANGFUSE_INIT_PROJECT_ID: ${LANGFUSE_INIT_PROJECT_ID:-}
      LANGFUSE_INIT_PROJECT_NAME: ${LANGFUSE_INIT_PROJECT_NAME:-}
      LANGFUSE_INIT_PROJECT_PUBLIC_KEY: ${LANGFUSE_INIT_PROJECT_PUBLIC_KEY:-}
      LANGFUSE_INIT_PROJECT_SECRET_KEY: ${LANGFUSE_INIT_PROJECT_SECRET_KEY:-}
      LANGFUSE_INIT_USER_EMAIL: ${LANGFUSE_INIT_USER_EMAIL:-}
      LANGFUSE_INIT_USER_NAME: ${LANGFUSE_INIT_USER_NAME:-}
      LANGFUSE_INIT_USER_PASSWORD: ${LANGFUSE_INIT_USER_PASSWORD:-}
    # Lets the Langfuse playground/evals reach Ollama on the host via
    # http://host.docker.internal:11434 (requires OLLAMA_HOST=0.0.0.0, see README).
    extra_hosts:
      - host.docker.internal:host-gateway

  # Analytics store for traces/observations/scores.
  clickhouse:
    image: docker.io/clickhouse/clickhouse-server:26.3.62.3
    restart: unless-stopped
    user: "101:101"
    environment:
      CLICKHOUSE_DB: default
      CLICKHOUSE_USER: clickhouse
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?set in .env}
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - clickhouse_logs:/var/log/clickhouse-server
    ports:
      - 127.0.0.1:8123:8123
      - 127.0.0.1:9000:9000
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://localhost:8123/ping || exit 1
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 1s

  # S3-compatible blob storage.
  minio:
    image: cgr.dev/chainguard/minio
    restart: unless-stopped
    entrypoint: sh
    # create the 'langfuse' bucket before starting the service
    command: -c 'mkdir -p /data/langfuse && minio server --address ":9000" --console-address ":9001" /data'
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set in .env}
    ports:
      - 127.0.0.1:9090:9000
      - 127.0.0.1:9091:9001
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 1s
      timeout: 5s
      retries: 5
      start_period: 1s

  # Queue + cache.
  redis:
    image: docker.io/redis:7
    restart: unless-stopped
    command: >
      --requirepass ${REDIS_AUTH:?set in .env}
      --maxmemory-policy noeviction
    ports:
      - 127.0.0.1:6379:6379
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 10s
      retries: 10

  # Transactional store: users, projects, API keys, prompts.
  postgres:
    image: docker.io/postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
      POSTGRES_DB: postgres
      TZ: UTC
      PGTZ: UTC
    ports:
      - 127.0.0.1:5432:5432
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 3s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
  clickhouse_data:
  clickhouse_logs:
  minio_data:
  redis_data:
