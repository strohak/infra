---
# workstation/playbook.yml
# Ansible playbook for restoring the 'bones' WSL2 dev environment.
# Idempotent — safe to re-run at any time to update tools or verify state.
#
# Run directly:  ansible-playbook playbook.yml --ask-become-pass

- name: Workstation Setup
  hosts: localhost
  connection: local

  vars:
    go_version: "1.24.5"           # Update this when upgrading Go
    go_install_dir: /usr/local/go
    user_home: "{{ ansible_env.HOME }}"
    user_bin: "{{ ansible_env.HOME }}/bin"

    apt_packages:
      - git
      - curl
      - wget
      - zsh
      - build-essential
      - podman
      - podman-compose
      - python3
      - python3-pip
      - python3-venv
      - jq
      - ripgrep
      - fzf
      - htop
      - unzip
      - ca-certificates
      - gnupg
      - make
      - gh

    zellij_version: "0.44.3"   # Update this when upgrading Zellij

    vscode_extensions:
      - golang.go
      - ms-python.python
      - ms-python.vscode-pylance
      - ms-python.debugpy
      - ms-python.vscode-python-envs
      - redhat.vscode-yaml
      - ms-vscode.makefile-tools
      - nefrob.vscode-just-syntax
      - ms-azuretools.vscode-containers
      - ms-vscode-remote.remote-ssh
      - ms-vscode-remote.remote-ssh-edit
      - ms-vscode-remote.remote-containers
      - ms-vscode.remote-explorer
      - anthropic.claude-code

    go_tools:
      - "golang.org/x/tools/gopls@latest"
      - "github.com/golangci/golangci-lint/cmd/golangci-lint@latest"
      - "github.com/air-verse/air@latest"
      - "github.com/go-delve/delve/cmd/dlv@latest"
      - "github.com/josharian/impl@latest"           # generate interface stubs
      - "golang.org/x/tools/cmd/goimports@latest"    # import organizer

    project_dirs:
      - "{{ user_home }}/code/personal"
      - "{{ user_home }}/code/lab"
      - "{{ user_home }}/code/infra"
      - "{{ user_home }}/bin"

  tasks:

    # ── Profile detection ──────────────────────────────────────────────────────
    # WSL2 kernels are tagged e.g. "5.15.153.1-microsoft-standard-WSL2"; this is
    # more robust than matching on distribution name since it works for any
    # Ubuntu-family target (WSL2 Ubuntu vs. bare-metal Ubuntu/Mint desktops).

    - name: Detect WSL2
      set_fact:
        wsl_detected: "{{ 'microsoft' in ansible_facts['kernel'] | lower }}"
        dpkg_arch: "{{ lookup('pipe', 'dpkg --print-architecture') }}"
        become_needed: "{{ ansible_facts['effective_user_id'] != 0 }}"

    # ── GitHub CLI apt repo ────────────────────────────────────────────────────

    - name: Add GitHub CLI apt keyring directory
      become: "{{ become_needed }}"
      file:
        path: /etc/apt/keyrings
        state: directory
        mode: "0755"

    - name: Add GitHub CLI apt keyring
      become: "{{ become_needed }}"
      get_url:
        url: https://cli.github.com/packages/githubcli-archive-keyring.gpg
        dest: /etc/apt/keyrings/githubcli-archive-keyring.gpg
        mode: "0644"

    - name: Add GitHub CLI apt repository
      become: "{{ become_needed }}"
      copy:
        dest: /etc/apt/sources.list.d/github-cli.list
        mode: "0644"
        content: "deb [arch={{ dpkg_arch }} signed-by=/etc/apt/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main\n"
      register: gh_repo_added

    - name: Update apt cache after adding GitHub CLI repo
      become: "{{ become_needed }}"
      apt:
        update_cache: true
      when: gh_repo_added.changed

    # ── System packages ────────────────────────────────────────────────────────

    - name: Update apt cache
      become: "{{ become_needed }}"
      apt:
        update_cache: true
        cache_valid_time: 3600

    - name: Install apt packages
      become: "{{ become_needed }}"
      apt:
        name: "{{ apt_packages }}"
        state: present

    # ── Shell ──────────────────────────────────────────────────────────────────

    - name: Set zsh as default shell
      become: "{{ become_needed }}"
      user:
        name: "{{ ansible_user_id }}"
        shell: /usr/bin/zsh

    - name: Ensure .zshrc exists
      file:
        path: "{{ user_home }}/.zshrc"
        state: touch
        mode: "0644"
        modification_time: preserve
        access_time: preserve

    # ── Directory structure ────────────────────────────────────────────────────

    - name: Create project directories
      file:
        path: "{{ item }}"
        state: directory
        mode: "0755"
      loop: "{{ project_dirs }}"

    # ── Go ─────────────────────────────────────────────────────────────────────

    - name: Check current Go version
      command: "{{ go_install_dir }}/bin/go version"
      register: go_installed
      ignore_errors: true
      changed_when: false

    - name: Set go_needs_install fact
      set_fact:
        go_needs_install: >-
          {{ go_installed.failed or ('go' + go_version) not in go_installed.stdout }}

    - name: Download Go tarball
      become: "{{ become_needed }}"
      get_url:
        url: "https://go.dev/dl/go{{ go_version }}.linux-amd64.tar.gz"
        dest: "/tmp/go{{ go_version }}.tar.gz"
        mode: "0644"
      when: go_needs_install

    - name: Remove existing Go installation
      become: "{{ become_needed }}"
      file:
        path: "{{ go_install_dir }}"
        state: absent
      when: go_needs_install

    - name: Install Go
      become: "{{ become_needed }}"
      unarchive:
        src: "/tmp/go{{ go_version }}.tar.gz"
        dest: /usr/local
        remote_src: true
      when: go_needs_install

    - name: Add Go and GOPATH to .zshrc
      blockinfile:
        path: "{{ user_home }}/.zshrc"
        marker: "# {mark} ANSIBLE MANAGED — Go"
        block: |
          export PATH=$PATH:/usr/local/go/bin:$HOME/go/bin
          export GOPATH=$HOME/go

    # ── Go tools ───────────────────────────────────────────────────────────────

    - name: Install Go tools
      command: "/usr/local/go/bin/go install {{ item }}"
      environment:
        HOME: "{{ user_home }}"
        GOPATH: "{{ user_home }}/go"
        PATH: "/usr/local/go/bin:{{ ansible_env.PATH }}"
      loop: "{{ go_tools }}"
      # go install is idempotent (reinstalls if binary missing); we flag changed
      # to keep re-runs visible in output
      changed_when: true

    # ── Podman ─────────────────────────────────────────────────────────────────

    - name: Add Podman and docker alias to .zshrc
      blockinfile:
        path: "{{ user_home }}/.zshrc"
        marker: "# {mark} ANSIBLE MANAGED — Podman"
        block: |
          alias docker=podman
          alias docker-compose=podman-compose

    # ── Zellij ─────────────────────────────────────────────────────────────────

    - name: Check current Zellij version
      command: zellij --version
      register: zellij_installed
      ignore_errors: true
      changed_when: false

    - name: Set zellij_needs_install fact
      set_fact:
        zellij_needs_install: >-
          {{ zellij_installed.failed or zellij_version not in zellij_installed.stdout }}

    - name: Download Zellij tarball
      get_url:
        url: "https://github.com/zellij-org/zellij/releases/download/v{{ zellij_version }}/zellij-x86_64-unknown-linux-musl.tar.gz"
        dest: "/tmp/zellij-{{ zellij_version }}.tar.gz"
        mode: "0644"
      when: zellij_needs_install

    - name: Install Zellij binary
      become: "{{ become_needed }}"
      unarchive:
        src: "/tmp/zellij-{{ zellij_version }}.tar.gz"
        dest: /usr/local/bin
        remote_src: true
        mode: "0755"
      when: zellij_needs_install

    # ── Starship prompt ────────────────────────────────────────────────────────

    - name: Check if Starship is installed
      command: which starship
      register: starship_check
      ignore_errors: true
      changed_when: false

    - name: Install Starship
      shell: curl -sS https://starship.rs/install.sh | sh -s -- --yes
      when: starship_check.failed

    - name: Add Starship init to .zshrc
      blockinfile:
        path: "{{ user_home }}/.zshrc"
        marker: "# {mark} ANSIBLE MANAGED — Starship"
        block: |
          eval "$(starship init zsh)"

    - name: Ensure ~/.config directory exists
      file:
        path: "{{ user_home }}/.config"
        state: directory
        mode: "0755"

    - name: Install Starship config
      copy:
        src: files/starship.toml
        dest: "{{ user_home }}/.config/starship.toml"
        mode: "0644"

    # ── VS Code (bare-metal desktops only — skipped under WSL2) ─────────────────
    # The `code` package manages its own apt repo file (vscode.sources) via its
    # postinst script once installed, so we only add ours if nothing has claimed
    # this repo yet — otherwise apt sees two conflicting Signed-By declarations
    # for the same URL.

    - name: Check for an existing VS Code apt repo
      stat:
        path: "{{ item }}"
      loop:
        - /etc/apt/sources.list.d/vscode.sources
        - /etc/apt/sources.list.d/vscode.list
      register: vscode_repo_files
      when: not wsl_detected

    - name: Set vscode_repo_exists fact
      set_fact:
        vscode_repo_exists: "{{ (not wsl_detected) and (vscode_repo_files.results | selectattr('stat.exists', 'true') | list | length > 0) }}"

    - name: Add Microsoft apt keyring
      become: "{{ become_needed }}"
      get_url:
        url: https://packages.microsoft.com/keys/microsoft.asc
        dest: /etc/apt/keyrings/microsoft.asc
        mode: "0644"
      when: not wsl_detected and not vscode_repo_exists

    - name: Add VS Code apt repository
      become: "{{ become_needed }}"
      copy:
        dest: /etc/apt/sources.list.d/vscode.list
        mode: "0644"
        content: "deb [arch={{ dpkg_arch }} signed-by=/etc/apt/keyrings/microsoft.asc] https://packages.microsoft.com/repos/code stable main\n"
      register: vscode_repo_added
      when: not wsl_detected and not vscode_repo_exists

    - name: Update apt cache after adding VS Code repo
      become: "{{ become_needed }}"
      apt:
        update_cache: true
      when: not wsl_detected and not vscode_repo_exists and vscode_repo_added.changed

    - name: Install VS Code
      become: "{{ become_needed }}"
      apt:
        name: code
        state: present
      when: not wsl_detected

    - name: Install VS Code extensions
      # code refuses to run as root/sudo without these extra flags
      command: >-
        code --install-extension {{ item }} --force
        {{ '--no-sandbox --user-data-dir=' + user_home + '/.vscode-root' if not become_needed else '' }}
      loop: "{{ vscode_extensions }}"
      changed_when: true
      when: not wsl_detected
      register: vscode_ext_install
      retries: 3
      delay: 3
      until: vscode_ext_install is not failed

    # ── Personal bin ───────────────────────────────────────────────────────────

    - name: Add ~/bin to PATH in .zshrc
      blockinfile:
        path: "{{ user_home }}/.zshrc"
        marker: "# {mark} ANSIBLE MANAGED — bin"
        block: |
          export PATH=$HOME/bin:$PATH

    # ── Summary ────────────────────────────────────────────────────────────────

    - name: Print completion summary
      debug:
        msg:
          - "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          - " Workstation setup complete"
          - "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          - " Profile:    {{ 'WSL2' if wsl_detected else 'bare-metal desktop' }}"
          - " Go:         {{ go_version }} → /usr/local/go"
          - " Shell:      zsh + Starship ({{ user_home }}/.config/starship.toml)"
          - " Containers: podman + podman-compose"
          - " Go tools:   gopls, golangci-lint, air, dlv, impl, goimports"
          - " CLI:        gh, zellij {{ zellij_version }}"
          - "{{ ' VS Code:    installed + curated extensions' if not wsl_detected else ' VS Code:    skipped (WSL2 — use the Windows-side install)' }}"
          - "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          - " Restore SSH keys and dotfiles manually."
          - " Then run: exec zsh"
          - "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
